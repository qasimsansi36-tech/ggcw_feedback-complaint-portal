<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Complaint - GGCW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 p-3 sidebar student-sidebar">
            <h5 class="text-center mb-4">GGCW Student</h5>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="fas fa-home me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a href="submit-complaint.html" class="nav-link active"><i class="fas fa-edit me-2"></i> File Complaint</a></li>
                <li class="nav-item"><a href="view-status.html" class="nav-link"><i class="fas fa-tasks me-2"></i> Track Status</a></li>
            </ul>
        </div>
        <div class="col-md-9 col-lg-10 p-4">
            <h4>Submit New Complaint</h4>
            <form class="bg-white p-4 rounded shadow-sm mt-3">
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select class="form-select">
                        <option>Hostel</option>
                        <option>Academic</option>
                        <option>Transport</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" rows="4"></textarea>
                </div>
                <button type="submit" class="btn btn-ggcw">Submit</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
