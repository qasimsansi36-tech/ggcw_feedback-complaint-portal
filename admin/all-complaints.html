<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Complaints - Admin Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin-dashboard.css">
</head>
<body class="bg-light">

    <div class="exact-blue-topbar">
        <a href="admin-dashboard.html" class="exact-back-nav-btn">
            <i class="fas fa-arrow-left me-1"></i> Dashboard
        </a>
        <h5 class="text-white m-0 fw-bold">All Registered Complaints</h5>
        <a href="../index.html" class="exact-pill-btn" onclick="localStorage.clear();"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    <div class="container my-4">
        <div class="card shadow-sm border-0 p-3 mb-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" id="search-box" class="form-control" placeholder="Search Roll No or Ticket ID...">
                </div>
                <div class="col-md-4">
                    <select id="filter-status" class="form-select">
                        <option value="">All Statuses</option>
                        <option value="Unresolved">Unresolved</option>
                        <option value="Pending">Pending</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary w-100 fw-bold" onclick="loadComplaints()"><i class="fas fa-sync"></i> Refresh List</button>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle m-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Roll No</th>
                            <th>Department</th>
                            <th>Subject</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="all-complaints-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_BASE_URL = 'http://127.0.0.1:8000';

        document.addEventListener('DOMContentLoaded', loadComplaints);

        function loadComplaints() {
            const token = localStorage.getItem('user_token');
            fetch(`${BACKEND_BASE_URL}/api/admin/complaints`, {
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
            })
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('all-complaints-body');
                tbody.innerHTML = '';
                let list = Array.isArray(data) ? data : (data.complaints || []);
                
                list.forEach(c => {
                    let badge = c.status === 'Resolved' ? 'bg-success' : (c.status === 'Pending' ? 'bg-warning text-dark' : 'bg-danger');
                    tbody.innerHTML += `
                        <tr>
                            <td>#${c.id}</td>
                            <td>${c.roll || c.student_roll || 'N/A'}</td>
                            <td>${c.department || 'N/A'}</td>
                            <td>${c.category || c.subject || 'General'}</td>
                            <td><span class="badge ${badge}">${c.status || 'Unresolved'}</span></td>
                            <td>${new Date(c.created_at).toLocaleDateString()}</td>
                            <td class="text-center">
                                <a href="view-complaint.html?id=${c.id}" class="btn btn-sm btn-outline-primary"><i class="fas fa-eye"></i> View Details</a>
                            </td>
                        </tr>`;
                });
            })
            .catch(err => console.error(err));
        }
    </script>
</body>
</html>
